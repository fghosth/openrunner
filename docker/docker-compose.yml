services:
  openrunner:
    build:
      # 主上下文 = 本仓库；core/ui 经 additional_contexts 注入（三仓同级布局）
      context: ..
      dockerfile: docker/Dockerfile
      additional_contexts:
        core: ../../openrunner-core
        ui: ../../openrunner-ui
    args:
      VERSION: ${VERSION:-docker}
    ports:
      - "8080:8080"
    volumes:
      - openrunner-data:/data
    restart: unless-stopped

volumes:
  openrunner-data:

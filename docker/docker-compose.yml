services:
  openrunner:
    build:
      # 主上下文 = 本仓库；core/ui 经 additional_contexts 注入（三仓同级布局）
      context: ..
      dockerfile: docker/Dockerfile
      additional_contexts:
        core: ../../openrunner-core
        ui: ../../openrunner-ui
      args:
        VERSION: ${VERSION:-docker}
        # 国内网络构建可覆盖：GOPROXY=https://goproxy.cn,direct
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    ports:
      - "8080:8080"
    # 默认 SQLite（数据卷内）。切换 MySQL：
    #   environment:
    #     OPENRUNNER_DB_DSN: "user:pass@tcp(host:3306)/openrunner?parseTime=true&charset=utf8mb4"
    volumes:
      - openrunner-data:/data
    restart: unless-stopped

volumes:
  openrunner-data:

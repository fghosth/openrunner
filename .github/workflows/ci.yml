name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  # openrunner-core 仓库坐标（同账号）；core 仓库推送后 CI 即全绿
  CORE_REPO: fghosth/openrunner-core

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      # checkout 布局须与 server/go.mod 的 replace（../../openrunner-core）匹配：
      # 主仓在 <ws>/openrunner，core 在同级 <ws>/openrunner-core
      - uses: actions/checkout@v4
        with:
          path: openrunner
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          path: openrunner-core
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: |
          cd openrunner/server
          go test ./...
          go vet ./...
          test -z "$(gofmt -l .)"

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          path: placeholder-core
        continue-on-error: true
      # UI 仓库的 CI 在 openrunner-ui 仓库内运行；此处占位以便未来 monorepo 聚合

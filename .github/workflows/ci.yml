name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  # openrunner-core 仓库坐标（同账号）；core 仓库推送后 CI 即全绿
  CORE_REPO: fghosth/openrunner-core

jobs:
  # 参照实现自测：「Go 与参照一致」只在参照本身正确时才有意义。
  # 参照曾照抄过一个错误的近似公式（W'bal 积分式），Go 照抄参照、单测真值又照抄同一个
  # 公式，三处同错 → 对照台全绿。这一层用解析真值把参照钉住。
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: openrunner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/test_golden_refs.py
        working-directory: openrunner

  server:
    runs-on: ubuntu-latest
    steps:
      # checkout 布局须与 server/go.mod 的 replace（../../openrunner-core）匹配：
      # 主仓在 <ws>/openrunner，core 在同级 <ws>/openrunner-core
      - uses: actions/checkout@v4
        with:
          path: openrunner
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          path: openrunner-core
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: |
          cd openrunner/server
          go test ./...
          go vet ./...
          test -z "$(gofmt -l .)"

  server-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: openrunner_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -ptest123"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: openrunner
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          path: openrunner-core
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: |
          cd openrunner/server
          OPENRUNNER_TEST_MYSQL_DSN='root:test123@tcp(127.0.0.1:3306)/openrunner_test?parseTime=true&charset=utf8mb4' \
            go test ./store/ -run TestMySQLCompatibility -v

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          path: placeholder-core
        continue-on-error: true
      # UI 仓库的 CI 在 openrunner-ui 仓库内运行；此处占位以便未来 monorepo 聚合

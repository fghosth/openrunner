name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 参照实现自测：「Go 与参照一致」只在参照本身正确时才有意义。
  # 参照曾照抄过一个错误的近似公式（W'bal 积分式），Go 照抄参照、单测真值又照抄同一个
  # 公式，三处同错 → 对照台全绿。这一层用解析真值把参照钉住。
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/test_golden_refs.py

  # core 是独立 go module（github.com/fghosth/openrunner/core）：
  # 领域算法与平台客户端，不依赖 Web 框架与 DB。单独成 job 让边界可见。
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: |
          cd core
          go test ./...
          go vet ./...
          test -z "$(gofmt -l .)"

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: |
          go test ./...
          go vet ./...
          test -z "$(gofmt -l ./server)"

  # MySQL 方言层：GORM 兼容 SQLite/MySQL，复杂聚合走 raw SQL，必须有真库兜住
  server-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: openrunner_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -ptest123"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: |
          OPENRUNNER_TEST_MYSQL_DSN='root:test123@tcp(127.0.0.1:3306)/openrunner_test?parseTime=true&charset=utf8mb4' \
            go test ./server/store/ -run TestMySQLCompatibility -v

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 类型检查 + 构建
        run: |
          cd web
          npm ci --silent
          npx tsc -b --force
          npm run build
      - name: lint（0 warning 门槛）
        run: cd web && npx oxlint src
      - name: i18n 审计（硬编码中文 + 服务端下发 key 覆盖）
        run: python3 scripts/i18n-audit.py

  # e2e 测的是生产形态：Go 单二进制内嵌前端产物（白屏事故只有这样才拦得住）
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --silent && npx playwright install --with-deps chromium
      - run: make e2e
